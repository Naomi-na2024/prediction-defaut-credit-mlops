<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CreditScore{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
    <header class="topbar">
        <div class="wrap topbar-inner">
            <a class="brand" href="/">
                <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M5 22 A 11 11 0 0 1 27 22" fill="none" stroke="#9db8ff" stroke-width="4" stroke-linecap="round"/>
                    <path d="M5 22 A 11 11 0 0 1 21.5 12.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="16" cy="22" r="3" fill="#fff"/>
                </svg>
                <span>Credit<span class="brand-accent">Score</span></span>
            </a>
            <nav class="nav">
                <a href="/" class="{{ 'active' if page == 'evaluer' }}">Évaluer<span class="desktop"> un dossier</span></a>
                <a href="/fichier" class="{{ 'active' if page == 'fichier' }}"><span class="desktop">Évaluer un fichier</span><span class="mobile">Fichier</span></a>
            </nav>
        </div>
    </header>

{% block content %}{% endblock %}
    <footer class="footer">
        <div class="wrap footer-inner">
            <span>Outil d'aide à la décision. La décision finale revient au conseiller.</span>
            <span>CreditScore · <a href="/developpeurs">API pour les développeurs</a></span>
        </div>
    </footer>
    <script src="/static/app.js?v={{ css_version }}" defer></script>
</body>
</html>
